name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EclipsePlayer.slnx

      - name: Build
        run: dotnet build EclipsePlayer.slnx --configuration Release --no-restore

      # No test project yet. Add once one exists:
      # - name: Test
      #   run: dotnet test EclipsePlayer.slnx --configuration Release --no-build
